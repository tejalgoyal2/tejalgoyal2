name: Print the edition

# Rebuilds README.md and edition/*.svg from live GitHub data: every Monday, whenever the
# config or the generator changes, and on demand from the Actions tab. Commits as Tejal,
# only when something actually changed.

on:
  schedule:
    - cron: '17 13 * * 1' # Mondays, 13:17 UTC (an off-peak minute, so the run isn't queued behind everyone's :00)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.json', 'scripts/**', 'assets/fonts/**', '.github/workflows/edition.yml']

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions pinned to a commit, not a tag that could be moved; the push token
      # isn't left in .git/config for every later step to find
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # PROFILE_TOKEN is optional: a fine-grained token with read-only access to public data lets
      # the year-in-halftone count private contributions too. Without it the built-in token is used.
      - name: Print the edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/build.mjs

      # the token is handed to this one step, only for the push
      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Tejal Goyal"
          git config user.email "132282123+tejalgoyal2@users.noreply.github.com"
          git add -A README.md edition assets
          if git diff --cached --quiet; then
            echo "Nothing changed, no edition to file."
          else
            git commit -m "Update profile ($(date -u +%Y-%m-%d))"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
          fi
